<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f9" />
    <meta name="description" content="TeamTask — plan, track and ship work together." />
    <title>TeamTask</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('tt.theme') || '"system"');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var d = JSON.parse(localStorage.getItem('tt.density') || '"comfortable"');
        document.documentElement.setAttribute('data-density', d);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="{{CSS}}" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="{{JS}}"></script>
  </body>
</html>
